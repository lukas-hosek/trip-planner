<!doctype html>
<!--
	Share card for one plan, filled in by build_link.py (--card). The assistant (Claude or ChatGPT) shows it
	in the chat in place of the long #plan= link, so the link never has to be copied into a reply by hand.
	Placeholders are $$name (Python string.Template); a literal dollar sign must be written as $$$$.
	The page is written in the fallback language; the script below switches it to the browser's language.
-->
<html lang="$fallback_language">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$plan_name · TripMap</title>
<style>
	:root {
		--color-paper: #eef0eb;
		--color-panel: #f8f9f6;
		--color-ink: #1d2a23;
		--color-muted: #5b6960;
		--color-line: #d3d9d1;
		--color-hover: #e6e9e1;
		--color-accent: #b0731c;
		--color-on-accent: #ffffff;
		--color-success: #2f7a4b;
		--color-danger: #b03a3a;
		--font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
		--font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
		color-scheme: light;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--color-paper: #121815;
			--color-panel: #18201c;
			--color-ink: #e4eae5;
			--color-muted: #9aa89f;
			--color-line: #2c3731;
			--color-hover: #26302b;
			--color-accent: #e0a24a;
			--color-on-accent: #1d2a23;
			--color-success: #6eb885;
			--color-danger: #f17b87;
			color-scheme: dark;
		}
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		padding: 16px;
		background: var(--color-paper);
		color: var(--color-ink);
		font: 16px/1.45 var(--font-body);
	}

	.card {
		max-width: 560px;
		margin: 0 auto;
		padding: 20px;
		background: var(--color-panel);
		border: 1px solid var(--color-line);
		border-radius: 14px;
	}

	.app-name {
		margin: 0 0 4px;
		color: var(--color-accent);
		font: 600 13px/1 var(--font-display);
		letter-spacing: .08em;
		text-transform: uppercase;
	}

	h1 {
		margin: 0;
		font: 600 28px/1.15 var(--font-display);
	}

	.summary {
		margin: 6px 0 0;
		color: var(--color-muted);
	}

	.description {
		margin: 12px 0 0;
	}

	.categories {
		display: flex;
		flex-wrap: wrap;
		gap: 6px;
		margin: 14px 0 0;
		padding: 0;
		list-style: none;
	}

	.category {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		padding: 3px 10px;
		border: 1px solid var(--color-line);
		border-radius: 999px;
		font-size: 14px;
	}

	.category-dot {
		width: 10px;
		height: 10px;
		border-radius: 50%;
		background: var(--category-color);
	}

	.actions {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		margin-top: 20px;
	}

	.button {
		flex: 1 1 auto;
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-height: 44px;
		padding: 0 16px;
		border: 1px solid var(--color-line);
		border-radius: 10px;
		background: transparent;
		color: var(--color-ink);
		font: 600 17px/1 var(--font-display);
		letter-spacing: .02em;
		text-decoration: none;
		cursor: pointer;
	}

	.button:hover {
		background: var(--color-hover);
	}

	.button--primary {
		flex-basis: 100%;
		border-color: var(--color-accent);
		background: var(--color-accent);
		color: var(--color-on-accent);
	}

	.button--primary:hover {
		background: var(--color-accent);
		filter: brightness(1.08);
	}

	.status {
		min-height: 1.45em;
		margin: 10px 0 0;
		font-size: 14px;
	}

	.status--success {
		color: var(--color-success);
	}

	.status--failure {
		color: var(--color-danger);
	}

	.hint {
		margin: 6px 0 0;
		color: var(--color-muted);
		font-size: 14px;
	}
</style>
</head>
<body>
<main class="card">
	<p class="app-name">TripMap</p>
	<h1>$plan_name</h1>
	<p class="summary" id="summary" data-place-count="$place_count" data-day-count="$day_count">$summary</p>
	$description_html
	$categories_html
	<div class="actions">
		<a class="button button--primary" id="open-link" href="$plan_link" target="_blank" rel="noopener" data-text="openInApp">$open_in_app_text</a>
		<button class="button" id="copy-link-button" type="button" data-text="copyLink">$copy_link_text</button>
		<a class="button" href="data:application/json;base64,$plan_json_base64" download="$json_file_name" data-text="downloadJson">$download_json_text</a>
	</div>
	<p class="status" id="status" role="status"></p>
	<p class="hint" data-text="iphoneHint">$iphone_hint_text</p>
</main>
<script type="application/json" id="card-texts">$card_texts_json</script>
<script>
	const cardTexts = JSON.parse(document.getElementById("card-texts").textContent);
	const fallbackLanguage = document.documentElement.lang;
	const statusElement = document.getElementById("status");
	const planLink = document.getElementById("open-link").href;

	// Like the app: the browser's languages in the user's order, each tried exactly, then as its base language (de-AT → de).
	function pickLanguage() {
		for (const browserLanguage of navigator.languages || [navigator.language]) {
			const code = String(browserLanguage).toLowerCase();
			const baseCode = code.split("-")[0];
			if (cardTexts.languages[code]) {
				return code;
			}
			if (cardTexts.languages[baseCode]) {
				return baseCode;
			}
		}
		return fallbackLanguage;
	}

	const language = pickLanguage();
	const texts = cardTexts.languages[language];

	function formatCount(pluralTexts, count) {
		const pluralCategory = new Intl.PluralRules(texts.locale).select(count);
		const pattern = pluralTexts[pluralCategory] || pluralTexts.other;
		return pattern.replace("{count}", count.toLocaleString(texts.locale));
	}

	function translateCard() {
		document.documentElement.lang = language;
		for (const element of document.querySelectorAll("[data-text]")) {
			element.textContent = texts[element.dataset.text];
		}
		const summaryElement = document.getElementById("summary");
		const summaryParts = [formatCount(texts.placeCount, Number(summaryElement.dataset.placeCount))];
		const dayCount = Number(summaryElement.dataset.dayCount);
		if (dayCount > 0) {
			summaryParts.push(formatCount(texts.dayCount, dayCount));
		}
		summaryElement.textContent = summaryParts.join(" · ");
	}

	function showStatus(message, isSuccess) {
		statusElement.textContent = message;
		statusElement.className = "status " + (isSuccess ? "status--success" : "status--failure");
	}

	// The card may run in a sandboxed frame without the Clipboard API; selecting text and copying still works there.
	function copyBySelectingText(text) {
		const textArea = document.createElement("textarea");
		textArea.value = text;
		textArea.setAttribute("readonly", "");
		textArea.style.position = "fixed";
		textArea.style.opacity = "0";
		document.body.append(textArea);
		textArea.select();
		let isCopied = false;
		try {
			isCopied = document.execCommand("copy");
		} catch {
			isCopied = false;
		}
		textArea.remove();
		return isCopied;
	}

	document.getElementById("copy-link-button").addEventListener("click", async () => {
		let isCopied = false;
		try {
			await navigator.clipboard.writeText(planLink);
			isCopied = true;
		} catch {
			isCopied = copyBySelectingText(planLink);
		}
		showStatus(isCopied ? texts.linkCopied : texts.copyFailed, isCopied);
	});

	translateCard();
</script>
</body>
</html>
