<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<!--
		Second line of defence behind escapeHtml: plans come from links anyone can craft, and this stops any script
		that isn't one of the app's own files or Leaflet, including inline handlers in injected HTML.
		A new external host (tiles, fonts, an API) must be added here, or the browser blocks it.
		style-src-attr allows the style="--plan-color: …" attributes that carry plan colours.
		Photos come from upload. and thumb.wikimedia.org, lookups from commons.wikimedia.org and the Wikipedias.
	-->
	<meta http-equiv="Content-Security-Policy" content="
		default-src 'none';
		script-src 'self' https://unpkg.com/leaflet@1.9.4/;
		style-src 'self' https://unpkg.com/leaflet@1.9.4/ https://fonts.googleapis.com;
		style-src-attr 'unsafe-inline';
		font-src https://fonts.gstatic.com;
		img-src 'self' data: https://*.tile.opentopomap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://*.wikimedia.org https://unpkg.com/leaflet@1.9.4/;
		connect-src 'self' https://*.wikimedia.org https://*.wikipedia.org https://*.tile.opentopomap.org;
		manifest-src 'self';
		worker-src 'self';
		base-uri 'none';
		form-action 'none';
		object-src 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TripMap</title>
	<meta name="description" content="A map of the places in your trip plans, offline too.">

	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	<meta name="apple-mobile-web-app-title" content="TripMap">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#f8f9f6" media="(prefers-color-scheme: light)" data-theme-color-for="light">
	<meta name="theme-color" content="#18201c" media="(prefers-color-scheme: dark)" data-theme-color-for="dark">
	<!-- Before the stylesheets, so a theme picked in the settings is on from the first frame without waiting for them. -->
	<script src="js/apply-theme-before-paint.js"></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/components.css">
	<link rel="stylesheet" href="css/sidebar.css">
	<link rel="stylesheet" href="css/map.css">
	<link rel="stylesheet" href="css/detail-card.css">
	<link rel="stylesheet" href="css/plans-panel.css">
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<header class="sidebar-header" id="sidebar-header">
				<div class="sidebar-title-row">
					<h1 class="plan-name" id="plan-name"></h1>
					<button class="icon-button plans-button" id="plans-button" type="button" aria-haspopup="dialog" data-translate-aria-label="plans.title" data-translate-title="plans.title">
						<span class="icon icon--menu" aria-hidden="true"></span>
					</button>
				</div>
				<p class="sidebar-intro" id="plan-intro"></p>
				<div class="filter-row">
					<div class="filter-chips" id="filter-chips" role="group" data-translate-aria-label="sidebar.filterLabel"></div>
					<button class="icon-button icon-button--chip filter-expand-button" id="filter-expand-button" type="button"
						aria-expanded="false" aria-controls="filter-chips" data-translate-aria-label="sidebar.showAllFilters" hidden>
						<span class="icon icon--chevron-down" aria-hidden="true"></span>
					</button>
				</div>
			</header>
			<section class="place-sheet bottom-sheet" id="place-sheet" data-translate-aria-label="sidebar.placeListLabel">
				<button class="sheet-handle" type="button"><span class="sheet-grabber" aria-hidden="true"></span></button>
				<ol class="place-list" id="place-list"></ol>
			</section>
			<footer class="sidebar-footer" id="plan-note" hidden></footer>
		</aside>

		<main class="map-area">
			<div id="map" data-translate-aria-label="map.label"></div>
			<div class="map-notice" id="map-notice" hidden></div>
			<div class="toast" id="toast" role="status" hidden></div>

			<section class="detail-card bottom-sheet" id="detail-card" data-translate-aria-label="detail.label" aria-live="polite" hidden>
				<button class="sheet-handle" type="button"><span class="sheet-grabber" aria-hidden="true"></span></button>
				<div class="detail-card-scroll-area" id="detail-card-scroll-area">
					<div class="detail-card-photo" id="detail-card-photo"></div>
					<div class="detail-card-content" id="detail-card-content"></div>
				</div>
				<button class="icon-button icon-button--on-photo detail-card-close" id="detail-card-close" type="button" data-translate-aria-label="detail.close">
					<span class="icon icon--close" aria-hidden="true"></span>
				</button>
			</section>
		</main>
	</div>

	<dialog class="plans-dialog" id="plans-dialog" aria-labelledby="plans-dialog-title">
		<span class="sheet-grabber plans-dialog-grabber" aria-hidden="true"></span>

		<div class="plans-dialog-view" id="plans-list-view">
			<header class="plans-dialog-header">
				<h2 id="plans-dialog-title" data-translate="plans.title"></h2>
				<button class="icon-button" id="show-settings-button" type="button" data-translate-aria-label="plans.settings" data-translate-title="plans.settings">
					<span class="icon icon--settings" aria-hidden="true"></span>
				</button>
				<!-- autofocus: opening the dialog still focuses ×, not the settings button in front of it. -->
				<button class="icon-button" type="button" data-close-dialog data-translate-aria-label="common.close" autofocus>
					<span class="icon icon--close" aria-hidden="true"></span>
				</button>
			</header>

			<ul class="boxed-list" id="stored-plan-list"></ul>
			<p class="plans-dialog-status" id="plans-status" role="status"></p>

			<div class="plans-dialog-footer">
				<button class="button" id="show-import-button" type="button">
					<span class="icon icon--import" aria-hidden="true"></span><span data-translate="plans.importPlan"></span>
				</button>
				<button class="link-button" id="show-help-button" type="button" data-translate="plans.howToCreate"></button>
			</div>

			<div class="menu" id="plan-actions-menu" role="menu" hidden></div>
		</div>

		<div class="plans-dialog-view" id="plans-import-view" hidden>
			<header class="plans-dialog-header">
				<button class="icon-button" type="button" data-show-list-view data-translate-aria-label="common.backToPlans">
					<span class="icon icon--back" aria-hidden="true"></span>
				</button>
				<h2 data-translate="import.title"></h2>
				<button class="icon-button" type="button" data-close-dialog data-translate-aria-label="common.close">
					<span class="icon icon--close" aria-hidden="true"></span>
				</button>
			</header>

			<label class="plans-dialog-label" for="import-text" data-translate="import.label"></label>
			<textarea class="plans-dialog-textarea" id="import-text" rows="6" spellcheck="false" autocomplete="off"
				placeholder="https://lukas-hosek.github.io/trip-planner/#plan=…"></textarea>
			<div class="plans-dialog-button-row">
				<button class="button" id="paste-from-clipboard-button" type="button" data-translate="import.paste"></button>
				<button class="button" id="choose-file-button" type="button" data-translate="import.chooseFile"></button>
				<input type="file" id="import-file-input" accept=".json,application/json,text/plain" hidden>
			</div>
			<p class="plans-dialog-error" id="import-error" role="alert" hidden></p>
			<button class="button button--primary plans-dialog-primary-button" id="import-button" type="button" data-translate="import.submit"></button>
		</div>

		<div class="plans-dialog-view" id="plans-help-view" hidden>
			<header class="plans-dialog-header">
				<button class="icon-button" type="button" data-show-list-view data-translate-aria-label="common.backToPlans">
					<span class="icon icon--back" aria-hidden="true"></span>
				</button>
				<h2 data-translate="plans.howToCreate"></h2>
				<button class="icon-button" type="button" data-close-dialog data-translate-aria-label="common.close">
					<span class="icon icon--close" aria-hidden="true"></span>
				</button>
			</header>

			<div class="plans-dialog-help">
				<p data-translate-html="help.skillHtml"></p>
				<p data-translate="help.replacing"></p>
				<p data-translate-html="help.iphoneHtml"></p>
			</div>
		</div>

		<div class="plans-dialog-view" id="plans-settings-view" hidden>
			<header class="plans-dialog-header">
				<button class="icon-button" type="button" data-show-list-view data-translate-aria-label="common.backToPlans">
					<span class="icon icon--back" aria-hidden="true"></span>
				</button>
				<h2 data-translate="settings.title"></h2>
				<button class="icon-button" type="button" data-close-dialog data-translate-aria-label="common.close">
					<span class="icon icon--close" aria-hidden="true"></span>
				</button>
			</header>

			<!-- The controls' contents are rendered by js/ui/settings-panel.js. -->
			<ul class="boxed-list">
				<li class="settings-row">
					<span class="settings-row-label" data-translate="settings.theme"></span>
					<button class="button button--select settings-control" id="theme-button" type="button"
						aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu"></button>
				</li>
				<li class="settings-row">
					<span class="settings-row-label" data-translate="settings.language"></span>
					<button class="button button--select settings-control" id="language-button" type="button"
						aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu"></button>
				</li>
				<li class="settings-row">
					<span class="settings-row-label" id="unit-system-label" data-translate="settings.units"></span>
					<div class="segmented-control settings-control" id="unit-system-control" role="group" aria-labelledby="unit-system-label"></div>
				</li>
			</ul>

			<div class="menu menu--select" id="theme-menu" role="menu" hidden></div>
			<div class="menu menu--select" id="language-menu" role="menu" hidden></div>
		</div>
	</dialog>

	<!-- Leaflet is loaded as a classic script so the modules can use the global `L`. -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
